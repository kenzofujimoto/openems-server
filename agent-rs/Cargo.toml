[package]
name = "openems-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
fastrand = "2.5.0"
gethostname = "1.1.0"
hex = "0.4.3"
idna = "1.1.0"
rcgen = { version = "0.14", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
time = "0.3"
x509-parser = "0.18"
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "json"] }
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Rpc", "Win32_System_Services", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Environment", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
