# Disposable stack for the DAST gate (tools/security_scan.py --only dast). Never shared data:
# random secrets come from the scanner, no port is published and `down -v` removes everything.
services:
  postgres:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    environment:
      POSTGRES_PASSWORD: ${DAST_POSTGRES_PASSWORD:?generated by tools/security_scan.py}
      POSTGRES_DB: openems
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openems"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [dast]

  redis:
    image: redis:7@sha256:44960b3100c48159a66d28c18b0588c193492e25f7551d60e51dd464fc3eca5b
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [dast]

  server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      OPENEMS_DATABASE_URL: postgresql://postgres:${DAST_POSTGRES_PASSWORD}@postgres:5432/openems
      OPENEMS_REDIS_URL: redis://redis:6379/0
      OPENEMS_ADMIN: dastadmin:${DAST_ADMIN_PASSWORD:?generated by tools/security_scan.py}
      OPENEMS_SESSION_SECRET: ${DAST_SESSION_SECRET:?generated by tools/security_scan.py}
      OPENEMS_ENROLLMENT_TOKEN: ${DAST_ENROLLMENT_TOKEN:?generated by tools/security_scan.py}
      OPENEMS_BASE_URL: http://localhost:8013
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [dast]

networks:
  dast:
    internal: true
