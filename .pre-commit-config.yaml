# Fast local checks before each commit: `pip install pre-commit && pre-commit install`.
# The full gates (history secrets, SCA, image, DAST) run in tools/security_scan.py and CI.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (security, bugbear, complexity)
        entry: python -m ruff check app agent tools tests
        language: system
        types: [python]
        pass_filenames: false
      - id: gitleaks-staged
        name: gitleaks (staged changes)
        entry: docker run --rm -v .:/repo ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --pre-commit --staged --redact --no-banner --config /repo/.gitleaks.toml /repo
        language: system
        pass_filenames: false
      - id: panel-lint
        name: panel ESLint (security, zero warnings)
        entry: npm run lint --prefix web
        language: system
        files: ^web/
        pass_filenames: false
      - id: cargo-fmt
        name: agent rustfmt
        entry: cargo fmt --manifest-path agent-rs/Cargo.toml --check
        language: system
        files: ^agent-rs/
        pass_filenames: false
