name: CI

# Feature branches run CI through their pull request; main runs on push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Component tests with coverage thresholds
        run: npm run test:coverage
      - name: Production build
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      OPENEMS_TEST_DSN: postgresql://postgres:ci-disposable-only@127.0.0.1:5432/postgres
      OPENEMS_TEST_REDIS: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the production panel for real API browser contracts
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web
      - name: Lint
        run: python -m ruff check app agent tools tests
      - name: Build the native agent for the cross-platform contract suite
        run: cargo build --release --locked --manifest-path agent-rs/Cargo.toml
      - name: Full suite including PostgreSQL, Redis, cryptographic SAML and browser
        # `coverage combine` only reads data files named `.coverage.*`.
        env:
          COVERAGE_FILE: .coverage.linux
          OPENEMS_REQUIRE_NATIVE_AGENT: "1"
        run: python -m pytest -q -m "not windows_only" --junitxml=integration.junit.xml --cov=app --cov=agent --cov-report=term-missing --cov-report=json:coverage.json --cov-report=xml:coverage.xml
      - name: Reject skipped Linux tests
        run: python tools/check_quality.py integration.junit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-coverage
          retention-days: 7
          include-hidden-files: true
          path: |
            *.junit.xml
            coverage.json
            coverage.xml
            .coverage.linux
      - name: Build runtime image
        run: docker build -t openems:ci .

  windows-service:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Agent and mocked Windows service checks
        env:
          COVERAGE_FILE: .coverage.windows
        run: python -m pytest agent -q --junitxml=windows.junit.xml --cov=app --cov=agent --cov-report=term-missing
      - name: Reject skipped Windows tests
        run: python tools/check_quality.py windows.junit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-coverage
          retention-days: 7
          include-hidden-files: true
          path: |
            windows.junit.xml
            .coverage.windows

  native-agent:
    runs-on: windows-latest
    env:
      WIX_VERSION: 5.0.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Format and lint
        working-directory: agent-rs
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Unit and shared-vector tests
        working-directory: agent-rs
        run: cargo test --locked
      - name: Release build (static CRT, no runtime dependencies)
        working-directory: agent-rs
        run: cargo build --release --locked
      - name: Build MSI
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          wix build agent-rs/installer/openems-agent.wxs -arch x64 -d Version=0.1.0 -d AgentExe=agent-rs/target/release/openems-agent.exe -d SessionExe=agent-rs/target/release/openems-session.exe -o openems-agent.msi
      - name: Contract, service and MSI installation tests
        env:
          OPENEMS_REQUIRE_NATIVE_AGENT: "1"
          OPENEMS_SERVICE_TESTS: "1"
          OPENEMS_MSI: openems-agent.msi
        # Cross-platform native contract plus every test marked windows_only (deselected on Linux).
        run: |
          python -m pytest tests/test_native_agent.py -q --junitxml=native-contract.junit.xml
          python -m pytest -m windows_only tests -q --junitxml=native.junit.xml
      - name: Reject skipped native tests
        run: |
          python tools/check_quality.py native-contract.junit.xml
          python tools/check_quality.py native.junit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openems-agent-windows
          retention-days: 14
          path: |
            openems-agent.msi
            agent-rs/target/release/openems-agent.exe
            agent-rs/target/release/openems-session.exe

  coverage:
    needs: [integration, windows-service]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-coverage
          path: coverage-input/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-coverage
          path: coverage-input/windows
      - name: Combine real platform coverage
        run: |
          python -m coverage combine coverage-input/linux coverage-input/windows
          python -m coverage report --show-missing
          python -m coverage json -o coverage.json
          python tools/check_quality.py coverage-input/linux/integration.junit.xml coverage.json
