<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>openems console</title>
<style>
  :root { --bg:#0f1419; --panel:#1a2029; --line:#2a333f; --fg:#e6edf3; --muted:#8b98a5; --accent:#e5484d; --ok:#3fb950; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:16px; margin:0; font-weight:600; letter-spacing:.3px; }
  header .sub { color:var(--muted); font-size:12px; }
  header .spacer { flex:1; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:7px 12px; font-size:13px; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--fg); }
  main { padding:20px; max-width:1100px; margin:0 auto; display:grid; gap:20px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .panel h2 { margin:0 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; }
  .tag { display:inline-block; background:#223; border:1px solid var(--line); border-radius:4px; padding:1px 6px; margin:1px; font-size:11px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input, textarea { background:var(--bg); border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:7px 9px; font:13px/1.4 monospace; }
  input { min-width:120px; } textarea { width:100%; min-height:60px; }
  label { color:var(--muted); font-size:12px; display:block; margin-bottom:3px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .big { font-size:28px; font-weight:700; }
  .toast { position:fixed; bottom:18px; right:18px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px; font-size:13px; opacity:0; transition:opacity .2s; }
  .toast.show { opacity:1; }
  .toast.err { border-color:var(--accent); }
  tr.click { cursor:pointer; } tr.click:hover td { background:#1f2733; }
  .btn-sm { padding:3px 8px; font-size:12px; border-radius:5px; }
  .btn-sm.del { background:transparent; border:1px solid var(--accent); color:var(--accent); }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; }
  .modal-bg.show { display:flex; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; width:min(560px,92vw); max-height:88vh; overflow:auto; }
  .kv { display:grid; grid-template-columns:150px 1fr; gap:4px 12px; font-size:13px; }
  .kv dt { color:var(--muted); } .kv dd { margin:0; font-family:monospace; word-break:break-all; }
  @media (max-width:720px){ .grid2 { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>openems</h1>
  <span class="sub">clean-room endpoint management console</span>
  <span class="spacer"></span>
  <button class="ghost" id="logout-btn" style="display:none" onclick="logout()">Sign out</button>
  <button class="ghost" onclick="refreshAll()">Refresh</button>
</header>

<main>
  <div class="panel">
    <h2>Endpoints</h2>
    <div class="big" id="count">–</div>
    <table>
      <thead><tr><th>devid</th><th>hostname</th><th>os</th><th>status</th><th>host tags</th></tr></thead>
      <tbody id="endpoints"></tbody>
    </table>
  </div>

  <div class="grid2">
    <div class="panel">
      <h2>Publish profile</h2>
      <div class="row">
        <div><label>vdom</label><input id="p-vdom" value="Default" /></div>
      </div>
      <label style="margin-top:10px">body (JSON)</label>
      <textarea id="p-body">{ "firewall": "on" }</textarea>
      <div class="row" style="margin-top:10px"><button onclick="publishProfile()">Publish</button></div>
    </div>

    <div class="panel">
      <h2>Assignment rule</h2>
      <div class="row">
        <div><label>id</label><input id="r-id" value="win" /></div>
        <div><label>target vdom</label><input id="r-vdom" value="Strict" /></div>
        <div><label>priority</label><input id="r-prio" value="10" style="min-width:70px" /></div>
      </div>
      <div class="row" style="margin-top:10px">
        <div><label>field</label><input id="r-field" value="os" /></div>
        <div><label>op</label><input id="r-op" value="contains" /></div>
        <div><label>value</label><input id="r-val" value="Windows" /></div>
      </div>
      <div class="row" style="margin-top:10px"><button onclick="addRule()">Add rule</button></div>
    </div>
  </div>

  <div class="panel">
    <h2>Rules</h2>
    <table>
      <thead><tr><th>priority</th><th>id</th><th>→ vdom</th><th>conditions</th><th>enabled</th><th></th></tr></thead>
      <tbody id="rules"></tbody>
    </table>
  </div>

  <div class="panel">
    <h2>Published profiles</h2>
    <table>
      <thead><tr><th>vdom</th><th>version</th><th>body</th><th>updated</th></tr></thead>
      <tbody id="profiles"></tbody>
    </table>
  </div>
</main>

<div class="modal-bg" id="modal-bg" onclick="closeDetail(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">Endpoint detail</h2>
      <button class="ghost" onclick="closeDetail()">Close</button>
    </div>
    <div id="detail" style="margin-top:12px"></div>
  </div>
</div>

<div class="modal-bg" id="login-bg">
  <div class="modal" style="width:min(360px,92vw)">
    <h2 style="margin:0 0 12px">Sign in</h2>
    <label>username</label><input id="l-user" style="width:100%" autocomplete="username" />
    <label style="margin-top:8px">password</label>
    <input id="l-pass" type="password" style="width:100%" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')doLogin()" />
    <div class="row" style="margin-top:14px"><button onclick="doLogin()">Sign in</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = ""; // same origin
let TOKEN = null;
try { TOKEN = localStorage.getItem("openems_token"); } catch (e) {}
function toast(msg, isErr) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast show" + (isErr ? " err" : "");
  setTimeout(() => (t.className = "toast"), 2500);
}
function showLogin() { document.getElementById("login-bg").classList.add("show"); }
function setToken(tok) {
  TOKEN = tok;
  try { tok ? localStorage.setItem("openems_token", tok) : localStorage.removeItem("openems_token"); } catch (e) {}
  document.getElementById("logout-btn").style.display = tok ? "" : "none";
}
async function doLogin() {
  try {
    const r = await fetch(API + "/api/v1/auth/login", {
      method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({ username: document.getElementById("l-user").value,
                             password: document.getElementById("l-pass").value }) });
    if (!r.ok) { toast("invalid credentials", true); return; }
    setToken((await r.json()).token);
    document.getElementById("login-bg").classList.remove("show");
    document.getElementById("l-pass").value = "";
    refreshAll();
  } catch (e) { toast(e.message, true); }
}
function logout() { setToken(null); showLogin(); }
async function api(path, opts = {}) {
  opts.headers = Object.assign({}, opts.headers, TOKEN ? { Authorization: "Bearer " + TOKEN } : {});
  const res = await fetch(API + path, opts);
  if (res.status === 401) { setToken(null); showLogin(); throw new Error("authentication required"); }
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.status);
  return res.status === 204 ? null : res.json();
}
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c])); }

async function loadEndpoints() {
  const [list, count] = await Promise.all([
    api("/api/v1/endpoints/index"), api("/api/v1/endpoints/count"),
  ]);
  document.getElementById("count").textContent = count.count;
  document.getElementById("endpoints").innerHTML = list.map(e => `
    <tr class="click" onclick="showDetail('${esc(e.devid)}')"><td>${esc(e.devid)}</td><td>${esc(e.hostname||"")}</td><td>${esc(e.os||"")}</td>
    <td>${esc(e.status)}</td><td>${(e.host_tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</td></tr>`
  ).join("") || `<tr><td colspan="5" style="color:var(--muted)">no endpoints registered</td></tr>`;
}
window._rules = [];
async function loadRules() {
  const rules = await api("/api/v1/assignment_rules");
  window._rules = rules;
  document.getElementById("rules").innerHTML = rules.map((r,i) => `
    <tr><td>${r.priority}</td><td>${esc(r.id)}</td><td>${esc(r.target_vdom)}</td>
    <td>${r.conditions.map(c=>`<span class="tag">${esc(c.field)} ${esc(c.op)} ${esc(JSON.stringify(c.value))}</span>`).join("")}</td>
    <td>${r.enabled ? "yes" : "no"}</td>
    <td class="row"><button class="ghost btn-sm" onclick="editRule(${i})">Edit</button>
    <button class="btn-sm del" onclick="deleteRule('${esc(r.id)}')">Delete</button></td></tr>`
  ).join("") || `<tr><td colspan="6" style="color:var(--muted)">no rules</td></tr>`;
}
async function loadProfiles() {
  const profiles = await api("/api/v1/profiles");
  document.getElementById("profiles").innerHTML = profiles.map(p => `
    <tr><td>${esc(p.vdom)}</td><td>v${p.version}</td>
    <td><code>${esc(JSON.stringify(p.body))}</code></td>
    <td style="color:var(--muted)">${esc((p.updated_at||"").replace("T"," ").slice(0,19))}</td></tr>`
  ).join("") || `<tr><td colspan="4" style="color:var(--muted)">no profiles</td></tr>`;
}
async function showDetail(devid) {
  try {
    const e = await api("/api/v1/endpoints/detail?devid=" + encodeURIComponent(devid));
    const assigned = e.effective_vdom !== e.vdom
      ? `${esc(e.effective_vdom)} <span class="tag">by rule, was ${esc(e.vdom)}</span>` : esc(e.effective_vdom);
    document.getElementById("detail").innerHTML = `<dl class="kv">
      <dt>devid</dt><dd>${esc(e.devid)}</dd>
      <dt>client_id</dt><dd>${esc(e.client_id)}</dd>
      <dt>hostname</dt><dd>${esc(e.hostname||"–")}</dd>
      <dt>os</dt><dd>${esc(e.os||"–")}</dd>
      <dt>fctver</dt><dd>${esc(e.fctver||"–")}</dd>
      <dt>status</dt><dd>${esc(e.status)}</dd>
      <dt>effective vdom</dt><dd>${assigned}</dd>
      <dt>config version</dt><dd>${e.config_version} / ${e.current_config_version} (applied/current)</dd>
      <dt>host tags</dt><dd>${(e.host_tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("") || "–"}</dd>
      <dt>last seen</dt><dd>${esc((e.last_seen||"").replace("T"," ").slice(0,19))}</dd></dl>`;
    document.getElementById("modal-bg").classList.add("show");
  } catch (e) { toast(e.message, true); }
}
function closeDetail(ev) { document.getElementById("modal-bg").classList.remove("show"); }
function editRule(i) {
  const r = window._rules[i]; const c = (r.conditions||[])[0] || {};
  document.getElementById("r-id").value = r.id;
  document.getElementById("r-vdom").value = r.target_vdom;
  document.getElementById("r-prio").value = r.priority;
  document.getElementById("r-field").value = c.field || "";
  document.getElementById("r-op").value = c.op || "";
  document.getElementById("r-val").value = c.value || "";
  toast("rule loaded into form — edit and Add to save");
}
async function deleteRule(id) {
  try { await api("/api/v1/assignment_rules/" + encodeURIComponent(id), { method:"DELETE" });
    toast(`rule ${id} removed`); await loadRules(); }
  catch (e) { toast(e.message, true); }
}
async function publishProfile() {
  try {
    const vdom = document.getElementById("p-vdom").value.trim();
    const body = JSON.parse(document.getElementById("p-body").value);
    const r = await api("/api/v1/profiles/" + encodeURIComponent(vdom), {
      method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(body) });
    toast(`profile ${vdom} v${r.version} published`); await loadProfiles();
  } catch (e) { toast("profile: " + e.message, true); }
}
async function addRule() {
  try {
    const rule = {
      id: document.getElementById("r-id").value.trim(),
      target_vdom: document.getElementById("r-vdom").value.trim(),
      priority: parseInt(document.getElementById("r-prio").value, 10) || 100,
      conditions: [{
        field: document.getElementById("r-field").value.trim(),
        op: document.getElementById("r-op").value.trim(),
        value: document.getElementById("r-val").value.trim(),
      }],
    };
    await api("/api/v1/assignment_rules", {
      method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(rule) });
    toast(`rule ${rule.id} added`); await loadRules();
  } catch (e) { toast("rule: " + e.message, true); }
}
async function refreshAll() {
  try { await Promise.all([loadEndpoints(), loadRules(), loadProfiles()]); }
  catch (e) { toast(e.message, true); }
}
if (TOKEN) document.getElementById("logout-btn").style.display = "";
refreshAll();
setInterval(() => { if (!document.getElementById("login-bg").classList.contains("show")) loadEndpoints(); }, 5000);
</script>
</body>
</html>
