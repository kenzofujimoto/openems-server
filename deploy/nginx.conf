worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
    server_tokens off;
    # Request URLs and endpoint identifiers are excluded from access logs.
    access_log off;
    error_log /dev/stderr warn;
    client_max_body_size 1m;
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Also sent by the application; repeated so error pages from nginx carry them too.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=()" always;
        location / {
            proxy_pass http://server:8013;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
        }
    }
}
