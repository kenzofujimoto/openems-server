# Required environment: POSTGRES_PASSWORD, OPENEMS_DATABASE_URL (URL-encode its
# password), OPENEMS_ADMIN, OPENEMS_SESSION_SECRET, OPENEMS_ENROLLMENT_TOKEN,
# OPENEMS_BASE_URL. No default credentials are supplied.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random database password}
      POSTGRES_DB: openems
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openems"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redisdata:/data
    restart: unless-stopped

  server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      OPENEMS_DATABASE_URL: ${OPENEMS_DATABASE_URL:?Set postgres URL using postgres hostname and openems database}
      OPENEMS_REDIS_URL: redis://redis:6379/0
      OPENEMS_ADMIN: ${OPENEMS_ADMIN:?Set bootstrap username:password}
      OPENEMS_SESSION_SECRET: ${OPENEMS_SESSION_SECRET:?Set a random persistent session secret}
      OPENEMS_ENROLLMENT_TOKEN: ${OPENEMS_ENROLLMENT_TOKEN:?Set a random enrollment invitation}
      OPENEMS_ENROLLMENT_VDOM: ${OPENEMS_ENROLLMENT_VDOM:-Default}
      OPENEMS_ENROLLMENT_USES: ${OPENEMS_ENROLLMENT_USES:-1}
      OPENEMS_BASE_URL: ${OPENEMS_BASE_URL:?Set public HTTPS base URL}
    ports:
      - "127.0.0.1:8013:8013"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
