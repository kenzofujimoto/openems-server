# Full stack: openems-server + PostgreSQL + Redis.
#   docker compose up --build
# Console at http://localhost:8013/console/  (login admin / changeme by default)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: openems
      POSTGRES_DB: openems
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      OPENEMS_DATABASE_URL: postgresql://postgres:openems@postgres:5432/openems
      OPENEMS_REDIS_URL: redis://redis:6379/0
      OPENEMS_ADMIN: ${OPENEMS_ADMIN:-admin:changeme}
      OPENEMS_BASE_URL: http://localhost:8013
    ports:
      - "8013:8013"

volumes:
  pgdata:
